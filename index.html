<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Thailand 2026</title>
<meta name="theme-color" content="#f7f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thailand 26">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root { --bg: #f7f7f9; --card: #fff; --ink: #1e1c2e; --muted: #67657a; --line: #e6e5ec; --navy: #2d2a4a; --red: #a51931; }
@media (prefers-color-scheme: dark) { :root { --bg: #121120; --card: #1b1a2b; --ink: #ecebf3; --muted: #a3a1b6; --line: #2c2a40; --navy: #c9c6ef; --red: #ff7d8f; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
form { width: min(100%, 360px); display: flex; flex-direction: column; gap: 14px; }
.flag { display: grid; grid-template-rows: 1fr 1fr 2fr 1fr 1fr; width: 64px; height: 42px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.flag i:nth-child(1), .flag i:nth-child(5) { background: #a51931; } .flag i:nth-child(2), .flag i:nth-child(4) { background: #fff; } .flag i:nth-child(3) { background: #2d2a4a; }
h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; color: var(--navy); } h1 span { color: var(--red); }
p { margin: -8px 0 4px; color: var(--muted); font-size: 14.5px; }
label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--ink); }
.row input { width: 20px; height: 20px; accent-color: #2d2a4a; }
button { font: inherit; font-weight: 700; padding: 13px; border: 0; border-radius: 12px; background: #2d2a4a; color: #fff; min-height: 48px; }
button:disabled { opacity: .6; }
.err { color: var(--red); font-size: 14px; min-height: 1.4em; margin: 0; }
[hidden] { display: none !important; }
.wait { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
.wait .flag { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { to { opacity: .4; } }
</style>
</head>
<body>
<div class="wait" id="wait" hidden><div class="flag" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<form id="f" autocomplete="off" hidden>
  <div class="flag" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Thailand <span>2026</span></h1>
  <p>Private trip app. Enter the password to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label class="row"><input id="rem" type="checkbox" checked> Remember on this iPhone</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
const D = {"s": "j3sfpLQAlTgI40hACOTBIA==", "it": 600000, "app": "a/app-2ce077d8633ab0.bin"};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const st = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let blob = null;
async function getApp() { if (blob) return blob; const r = await fetch(D.app); if (!r.ok) throw new Error("net"); return (blob = new Uint8Array(await r.arrayBuffer())); }
async function unlock(pw) {
  const buf = await getApp().catch(() => { throw new Error("net"); });
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.s), iterations: D.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let gz; try { gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)); } catch (e) { throw new Error("pw"); }
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html, pw) { html = html.replace("<head>", "<head><script>window.__TH26PW=" + JSON.stringify(pw).replace(/</g, "\\u003c") + ";window.__TH26APP=" + JSON.stringify(D.app) + ";<\/script>"); document.open(); document.write(html); document.close(); }
const form = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go"), wait = document.getElementById("wait");
const msg = (x) => x && x.message === "net" ? "Could not load the app. Connect to the internet once and try again." : typeof DecompressionStream === "undefined" ? "Please update iOS to open this app." : "Wrong password. Check capital letters and the dashes.";
form.addEventListener("submit", async (e) => {
  e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Opening…";
  const pw = document.getElementById("pw").value.trim();
  try { const html = await unlock(pw); if (document.getElementById("rem").checked) st.set("th26.pw", pw); else st.del("th26.pw"); show(html, pw); }
  catch (x) { err.textContent = msg(x); go.disabled = false; go.textContent = "Open"; }
});
(async () => {
  const saved = st.get("th26.pw");
  if (!saved) { form.hidden = false; return; }
  wait.hidden = false;
  try { show(await unlock(saved), saved); }
  catch (x) { if (x && x.message === "pw") st.del("th26.pw"); wait.hidden = true; form.hidden = false; err.textContent = msg(x); }
})();
</script>
</body>
</html>
